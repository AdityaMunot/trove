<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" role="img" aria-label="trove dogfood loop animation">
  <!-- terminal chrome -->
  <rect width="720" height="360" fill="#1e1e2e" rx="8"/>
  <rect x="0" y="0" width="720" height="36" fill="#181825" rx="8"/>
  <rect x="0" y="28" width="720" height="8" fill="#181825"/>
  <circle cx="22" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="44" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="66" cy="18" r="6" fill="#a6e3a1"/>
  <text x="360" y="22" text-anchor="middle" fill="#cdd6f4" font-size="12" opacity="0.7">trove — dogfood loop</text>

  <!-- frame 1: todo add (visible 0–3s) -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;0;0;0" keyTimes="0;0.21;0.24;0.5;0.75;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="24" y="80" fill="#89b4fa">$</text>
    <text x="44" y="80" fill="#cdd6f4">todo add "Refactor auth middleware" -p high -t auth</text>
    <text x="24" y="108" fill="#a6e3a1">#4 added: Refactor auth middleware</text>
  </g>

  <!-- frame 2: todo list (visible 3.5–6.5s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.24;0.27;0.46;0.5;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="24" y="80" fill="#89b4fa">$</text>
    <text x="44" y="80" fill="#cdd6f4">todo list</text>
    <text x="24" y="108" fill="#cdd6f4">[ ] #  1 ! Make the first commit                </text>
    <text x="380" y="108" fill="#94e2d5">#infra</text>
    <text x="24" y="128" fill="#cdd6f4">[ ] #  4 ! Refactor auth middleware             </text>
    <text x="380" y="128" fill="#94e2d5">#auth</text>
  </g>

  <!-- frame 3: git commit closes #4 (visible 7–10.5s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.46;0.5;0.51;0.54;0.74;0.78;1" dur="14s" repeatCount="indefinite"/>
    <text x="24" y="80" fill="#89b4fa">$</text>
    <text x="44" y="80" fill="#cdd6f4">git commit -m "Refactor middleware; closes #4"</text>
    <text x="24" y="108" fill="#cdd6f4">[master a3b4c5d] Refactor middleware; closes #4</text>
    <text x="24" y="132" fill="#a6e3a1">#4 done: Refactor auth middleware</text>
    <text x="24" y="160" fill="#7f849c" font-style="italic" font-size="12">↑ post-commit hook reads the commit message and closes the todo</text>
  </g>

  <!-- frame 4: todo list shows it's gone (visible 11–14s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.5;0.74;0.77;0.78;0.79;0.82;1" dur="14s" repeatCount="indefinite"/>
    <text x="24" y="80" fill="#89b4fa">$</text>
    <text x="44" y="80" fill="#cdd6f4">todo list</text>
    <text x="24" y="108" fill="#cdd6f4">[ ] #  1 ! Make the first commit                </text>
    <text x="380" y="108" fill="#94e2d5">#infra</text>
    <text x="24" y="140" fill="#7f849c" font-style="italic">#4 is gone — closed by the commit.</text>
  </g>

  <!-- progress dots at bottom -->
  <g transform="translate(280, 320)">
    <circle cx="0"   cy="0" r="5" fill="#cba6f7">
      <animate attributeName="fill" values="#cba6f7;#cba6f7;#45475a;#45475a;#45475a;#45475a;#45475a;#cba6f7" keyTimes="0;0.24;0.27;0.5;0.78;0.82;0.97;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40"  cy="0" r="5" fill="#45475a">
      <animate attributeName="fill" values="#45475a;#45475a;#cba6f7;#cba6f7;#45475a;#45475a;#45475a" keyTimes="0;0.24;0.27;0.5;0.51;0.78;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80"  cy="0" r="5" fill="#45475a">
      <animate attributeName="fill" values="#45475a;#45475a;#45475a;#45475a;#cba6f7;#cba6f7;#45475a;#45475a" keyTimes="0;0.27;0.5;0.51;0.54;0.74;0.78;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="0" r="5" fill="#45475a">
      <animate attributeName="fill" values="#45475a;#45475a;#45475a;#45475a;#45475a;#45475a;#cba6f7;#cba6f7" keyTimes="0;0.5;0.74;0.77;0.78;0.79;0.82;1" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="360" y="350" text-anchor="middle" fill="#7f849c" font-size="11">add → list → commit (auto-close) → backlog clears</text>
</svg>
